<html>
<head>
	<title>FW Upgrade</title>
	<link rel="stylesheet" href="FW_Upgrade.css"></link>
	<script type="text/javascript" src="FW_Upgrade.js"></script>
</head>
<body onload="init()">
<div class="fwu-main" id="fwu_app">
	<div class="fwu-title">PiPicoFX Firmware Upgrade</div>
	<div class="fwu-text">Connect Daisy Seed Powered PiPicoFX via USB and click </div>
	<button class="fwu-button" onclick="requestDevice()">Detect device</button>
	<div class="fwu-console" style="height: 36px;">
		<div class="fwu-console-inner" id="fwu-console-1">
		</div>
	</div>
	<div class="fwu-text">Choose Firmware Version</div>
	<select class="fwu-button" id="selectFirmware">
		
	</select>
	<br />
	<button class="fwu-button" onclick="updateFirmwareHandler()" id="fwu-button" disabled>Update firmware</button>
	<div class="fwu-console" style="flex-grow: 4;" >
		<div class="fwu-console-inner" id="fwu-console-2" ></div>
	</div>
	<div class="fwu-msgbox" style="display:hidden" id="msgbox">
		<div class="fwu-text" id="msgbox_text"></div>
		<img id="msgbox_img" style="margin-left: auto;margin-right: auto;max-width: 84px;width:auto;height: auto; padding: 10px;" src="firmwareflashing_stm32.gif"></img>
		<button class="fwu-button" onclick="handleMsgBox()">OK</button>
	</div>
</div>
</body>
</html>
